name: Prepare rendering test dependencies
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-render-test.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Collect rendering test dependencies
        run: |
          mkdir -p qa
          cp -L /lib/x86_64-linux-gnu/libXfont2.so.2 qa/libXfont2.so.2
          if command -v xkbcomp >/dev/null; then cp "$(command -v xkbcomp)" qa/xkbcomp; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Rendering-Test-Dependencies
          path: qa/
          retention-days: 1
