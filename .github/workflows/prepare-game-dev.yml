name: Prepare Android game development tools
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-game-dev.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Godot and open 3D assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/models qa/tools
          curl -fL --retry 4 -o qa/godot.zip "https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip"
          BASE="https://raw.githubusercontent.com/agustindiazcano/zombie-horde-survivors/02f1a2502aed27e38f1c6f1305552d781873b700/public/models"
          for FILE in soldier-marine-light.glb soldier-quaternius-bluemale.glb enemy-zombie.glb enemy-brute.glb; do curl -fL --retry 4 -o "qa/models/$FILE" "$BASE/$FILE"; done
          if command -v Xvfb >/dev/null; then cp "$(command -v Xvfb)" qa/tools/Xvfb; ldd "$(command -v Xvfb)" > qa/tools/xvfb-ldd.txt; fi
          if command -v xauth >/dev/null; then cp "$(command -v xauth)" qa/tools/xauth; fi
          if command -v xvfb-run >/dev/null; then cp "$(command -v xvfb-run)" qa/tools/xvfb-run; fi
      - name: Upload tools and art for build validation
        uses: actions/upload-artifact@v4
        with:
          name: Android-Game-Development-Tools
          path: qa/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
