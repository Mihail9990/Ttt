name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build permanently signed test APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check permanent test keystore
        shell: bash
        run: |
          set -euo pipefail
          test -s signing/test-debug.jks
          keytool -list -storetype PKCS12 -keystore signing/test-debug.jks \
            -storepass android -alias androiddebugkey > /dev/null
          echo "Permanent test signing certificate found."

      - name: Build Android test APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify "$APK"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -F "Signer #1 certificate SHA-256 digest:" \
            | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          EXPECTED_SHA256="6398dd5ad6f1afafbe5f6d2ee2886e02de2f81082ecb833d2a2d15beadc92f29"
          if [[ "$CERT_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Unexpected APK signing certificate!"
            exit 1
          fi
          echo "Verified permanent test signing certificate: $CERT_SHA256"

      - name: Name APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/APK-Starter-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Starter-v1.0.${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
