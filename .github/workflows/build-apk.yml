name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Load optional permanent signing key
        id: signing
        shell: bash
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_KEYSTORE_BASE64" && -z "$APP_KEYSTORE_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured. Will build debug APK only."
          elif [[ -z "$APP_KEYSTORE_BASE64" || -z "$APP_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Both APP_KEYSTORE_BASE64 and APP_KEYSTORE_PASSWORD secrets must be set."
            exit 1
          else
            (umask 077; printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > app/signing.keystore)
            test -s app/signing.keystore
            keytool -list -keystore app/signing.keystore -storetype PKCS12 \
              -alias apkbuilder -storepass "$APP_KEYSTORE_PASSWORD" > /dev/null
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Permanent signing key loaded and validated."
          fi

      - name: Build installable debug APK
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify debug APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"

      - name: Verify release APK signature
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
